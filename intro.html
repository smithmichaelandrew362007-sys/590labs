<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>590 LABS® — Beyond The Ordinary | Unisex Streetwear</title>
  <meta name="description" content="590 LABS — Independent unisex streetwear label engineered from heavyweight textiles, brutalist silhouettes, and technical daily utility." />

  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@700;800&display=swap" />

  <!-- Preload Background Image -->
  <link rel="preload" as="image" href="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=1600&auto=format&fit=crop&q=75&fm=webp" fetchpriority="high" />

  <!-- Intro Stylesheet -->
  <link rel="stylesheet" href="css/intro.css" />
</head>
<body style="margin: 0; background-color: #070707; overflow: hidden;">

  <!-- ========================================================================
       590 LABS® CINEMATIC BRAND INTRODUCTION
       ======================================================================== -->
  <main class="cinematic-intro" id="cinematicIntro" role="region" aria-label="Brand Introduction">
    <!-- Cinematic Fullscreen Background -->
    <div class="cinematic-bg-wrap">
      <img class="cinematic-bg-img" 
           src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=1600&auto=format&fit=crop&q=75&fm=webp" 
           alt="590 LABS Streetwear Editorial Campaign" 
           width="1600" 
           height="900" 
           fetchpriority="high" />
      <div class="cinematic-overlay"></div>
    </div>

    <!-- Top Metadata -->
    <div class="cinematic-top-meta">
      <span>CONCEPT 01 // AUTONOMY ARCHIVE</span>
      <span class="cinematic-live-badge">SYSTEM ACTIVE</span>
    </div>

    <!-- Center Stage: Logo, Tagline & Enter Button -->
    <div class="cinematic-center-stage">
      <!-- Brand Logo (Scene 2) -->
      <div class="cinematic-logo-wrap">
        <img class="cinematic-brand-logo" 
             src="assets/logo-white.svg" 
             alt="590 LABS Logo" 
             width="280" 
             height="40" 
             onerror="this.style.display='none'; document.getElementById('introFallbackLogo').style.display='flex';" />
        <div id="introFallbackLogo" class="cinematic-logo-text" style="display: none;">
          590 LABS<span class="reg">®</span>
        </div>
      </div>

      <!-- Tagline (Scene 3) -->
      <p class="cinematic-tagline">
        BEYOND THE ORDINARY.
      </p>

      <!-- Enter Call To Action (Scene 4) -->
      <div class="cinematic-cta-wrap">
        <button type="button" class="cinematic-enter-btn" id="cinematicEnterBtn" aria-label="Enter 590 LABS Storefront in a new tab">
          <span>ENTER STORE ↗</span>
        </button>

        <!-- Success Notice: Opened in New Tab -->
        <div class="cinematic-notice notice-success" id="introNoticeSuccess" role="status">
          <div><span class="status-dot">●</span> <strong>YOUR STORE IS OPEN IN A NEW TAB.</strong></div>
          <a class="cinematic-inline-enter-link" id="introContinueHereLink">Continue browsing in this tab instead ↗</a>
        </div>

        <!-- Fallback Notice: Popup Blocked -->
        <div class="cinematic-notice notice-fallback" id="introNoticeBlocked" role="alert">
          <span>Your browser blocked the new tab. Continue to the store here:</span>
          <button type="button" class="cinematic-fallback-btn" id="introFallbackBtn">
            CONTINUE TO STORE HERE ↗
          </button>
        </div>
      </div>
    </div>

    <!-- Bottom Archival Specs -->
    <div class="cinematic-bottom-meta">
      <span>INDEPENDENT UNISEX STREETWEAR</span>
      <span>CONCEPT 01 // 2026</span>
    </div>
  </main>

  <!-- Intro Controller Script -->
  <script src="js/intro.js"></script>
</body>
</html>
